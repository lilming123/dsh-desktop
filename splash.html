<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #ffffff;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    gap: 28px;
    padding: 40px;
  }

  /* DeepSeek whale SVG logo */
  .logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }


  .title {
    font-size: 22px;
    font-weight: 700;
    color: #0d0d12;
    letter-spacing: -0.4px;
    line-height: 1;
  }
  .tagline {
    font-size: 13px;
    color: #8b8fa8;
    margin-top: -20px;
    font-weight: 400;
  }

  /* Steps */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 340px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 10px;
    background: #f7f8fc;
    border: 1px solid #ebebf0;
    font-size: 13px;
    color: #9095ad;
    font-weight: 450;
    transition: all 0.25s ease;
    -webkit-app-region: no-drag;
  }
  .step.active {
    background: #eef0ff;
    border-color: #c5caff;
    color: #2d3ac8;
  }
  .step.done {
    background: #f0faf5;
    border-color: #b8e8cd;
    color: #1a8c51;
  }
  .step.error {
    background: #fff5f5;
    border-color: #fcc;
    color: #c62828;
  }
  .step-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .step-spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(77, 107, 254, 0.2);
    border-top-color: #4D6BFE;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress bar */
  .progress-wrap {
    width: 340px;
    height: 3px;
    background: #ebebf0;
    border-radius: 99px;
    overflow: hidden;
    margin-top: -12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4D6BFE, #6d8aff);
    border-radius: 99px;
    transition: width 0.45s ease;
    width: 0%;
  }

  .status-line {
    font-size: 12px;
    color: #adb0c2;
    margin-top: -18px;
    min-height: 15px;
    text-align: center;
  }

  .btn-retry {
    display: none;
    padding: 9px 24px;
    background: #4D6BFE;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: -16px;
    transition: background 0.18s;
    -webkit-app-region: no-drag;
  }
  .btn-retry:hover { background: #3a58f0; }
</style>
</head>

  <div class="title">DeepSeek Harness</div>
  <div class="tagline" id="tagline">Initializing…</div>

  <div class="steps">
    <div class="step" id="step-node">
      <span class="step-icon">○</span>
      <span>Checking Node.js</span>
    </div>
    <div class="step" id="step-install">
      <span class="step-icon">○</span>
      <span id="lbl-install">Checking @deepseek-ai/dsh</span>
    </div>
    <div class="step" id="step-start">
      <span class="step-icon">○</span>
      <span>Starting server on :3080</span>
    </div>
    <div class="step" id="step-ready">
      <span class="step-icon">○</span>
      <span>Opening DeepSeek Harness</span>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="pbar"></div></div>

  <div class="status-line" id="status"></div>
  <button class="btn-retry" id="btnRetry">Try Again</button>

  <script>
    const els = {
      node:    document.getElementById('step-node'),
      install: document.getElementById('step-install'),
      start:   document.getElementById('step-start'),
      ready:   document.getElementById('step-ready'),
    };
    const pbar    = document.getElementById('pbar');
    const status  = document.getElementById('status');
    const tagline = document.getElementById('tagline');
    const retryBtn = document.getElementById('btnRetry');
    const lblInstall = document.getElementById('lbl-install');

    function activate(id) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.add('active');
      el.querySelector('.step-icon').style.visibility = 'hidden';
      const sp = document.createElement('div');
      sp.className = 'step-spinner';
      el.insertBefore(sp, el.firstChild);
    }
    function done(id) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.remove('active');
      el.classList.add('done');
      const icon = el.querySelector('.step-icon');
      icon.style.visibility = '';
      icon.textContent = '✓';
    }
    function fail(id, msg) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.remove('active');
      el.classList.add('error');
      const icon = el.querySelector('.step-icon');
      icon.style.visibility = '';
      icon.textContent = '✕';
      tagline.textContent = 'Setup failed';
      status.textContent = msg || '';
      retryBtn.style.display = 'inline-block';
    }

    function applyProgress(d) {
      if (d.pct !== undefined) pbar.style.width = d.pct + '%';
      if (d.msg) status.textContent = d.msg;
      if (d.label) tagline.textContent = d.label;
      if (d.installLabel) lblInstall.textContent = d.installLabel;
      if (d.state === 'active') activate(d.step);
      if (d.state === 'done')   done(d.step);
      if (d.state === 'error')  fail(d.step, d.msg);
    }

    // Drain buffered events from before IPC listener was ready
    if (window.__progressQueue) {
      window.__progressQueue.forEach(applyProgress);
      window.__progressQueue = null;
    }
    if (window.electronAPI) {
      window.electronAPI.onProgress(applyProgress);
    }
    retryBtn.onclick = () => window.electronAPI?.retry();
  </script>
