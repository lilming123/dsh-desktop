<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #ffffff;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    gap: 28px;
    padding: 40px;
  }

  /* DeepSeek whale SVG logo */
  .logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }


  .title {
    font-size: 22px;
    font-weight: 700;
    color: #0d0d12;
    letter-spacing: -0.4px;
    line-height: 1;
  }
  .tagline {
    font-size: 13px;
    color: #8b8fa8;
    margin-top: -20px;
    font-weight: 400;
  }

  /* Steps */
  .steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 340px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 10px;
    background: #f7f8fc;
    border: 1px solid #ebebf0;
    font-size: 13px;
    color: #9095ad;
    font-weight: 450;
    transition: all 0.25s ease;
    -webkit-app-region: no-drag;
  }
  .step.active {
    background: #eef0ff;
    border-color: #c5caff;
    color: #2d3ac8;
  }
  .step.done {
    background: #f0faf5;
    border-color: #b8e8cd;
    color: #1a8c51;
  }
  .step.error {
    background: #fff5f5;
    border-color: #fcc;
    color: #c62828;
  }
  .step-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .step-spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(77, 107, 254, 0.2);
    border-top-color: #4D6BFE;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress bar */
  .progress-wrap {
    width: 340px;
    height: 3px;
    background: #ebebf0;
    border-radius: 99px;
    overflow: hidden;
    margin-top: -12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4D6BFE, #6d8aff);
    border-radius: 99px;
    transition: width 0.45s ease;
    width: 0%;
  }

  .status-line {
    font-size: 12px;
    color: #adb0c2;
    margin-top: -18px;
    min-height: 15px;
    text-align: center;
  }

  .btn-retry {
    display: none;
    padding: 9px 24px;
    background: #4D6BFE;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: -16px;
    transition: background 0.18s;
    -webkit-app-region: no-drag;
  }
  .btn-retry:hover { background: #3a58f0; }
</style>
</head>
<body>
  <!-- DeepSeek whale logo (user-provided) -->

  <div class="title">DeepSeek Harness</div>
  <div class="tagline" id="tagline" data-i18n="app.tagline">Starting up…</div>

  <div class="steps">
    <div class="step" id="step-runtime">
      <span class="step-icon">○</span>
      <span data-i18n="steps.runtime.checking">Preparing runtime</span>
    </div>
    <div class="step" id="step-start">
      <span class="step-icon">○</span>
      <span data-i18n="steps.start.starting">Starting server…</span>
    </div>
    <div class="step" id="step-plugin">
      <span class="step-icon">○</span>
      <span data-i18n="steps.plugin.checking">Checking dsh-api plugin</span>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="pbar"></div></div>

  <div class="status-line" id="status"></div>
  <button class="btn-retry" id="btnRetry" data-i18n="errors.tryAgain">Try Again</button>

  <script>
    // i18n: 字典从主进程注入，支持语言切换后动态刷新
    let i18nDict = {};

    function t(key, vars = {}) {
      let val = i18nDict;
      for (const p of key.split('.')) { val = val?.[p]; if (val === undefined) return key; }
      let str = typeof val === 'string' ? val : String(val);
      for (const [k, v] of Object.entries(vars || {})) str = str.replace(new RegExp('{{' + k + '}}', 'g'), String(v));
      return str;
    }

    // 刷新所有 data-i18n 元素的文案
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
    }

    // 主进程推送字典 + 语言切换时重推
    if (window.electronAPI?.onI18n) {
      window.electronAPI.onI18n(dict => { i18nDict = dict; applyI18n(); });
    }

    const els = {
      runtime: document.getElementById('step-runtime'),
      start:   document.getElementById('step-start'),
      plugin:  document.getElementById('step-plugin'),
    };
    const pbar    = document.getElementById('pbar');
    const status  = document.getElementById('status');
    const tagline = document.getElementById('tagline');
    const retryBtn = document.getElementById('btnRetry');

    function activate(id) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.add('active');
      el.querySelector('.step-icon').style.visibility = 'hidden';
      const sp = document.createElement('div');
      sp.className = 'step-spinner';
      el.insertBefore(sp, el.firstChild);
    }
    function done(id) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.remove('active');
      el.classList.add('done');
      const icon = el.querySelector('.step-icon');
      icon.style.visibility = '';
      icon.textContent = '✓';
    }
    function fail(id, msg) {
      const el = els[id];
      el.querySelectorAll('.step-spinner').forEach(s => s.remove());
      el.classList.remove('active');
      el.classList.add('error');
      const icon = el.querySelector('.step-icon');
      icon.style.visibility = '';
      icon.textContent = '✕';
      tagline.textContent = t('errors.setupFailed');
      status.textContent = msg || '';
      retryBtn.style.display = 'inline-block';
    }

    function applyProgress(d) {
      if (d.pct !== undefined) pbar.style.width = d.pct + '%';
      if (d.msg) status.textContent = d.msg;
      if (d.label) tagline.textContent = d.label;
      if (d.state === 'active') activate(d.step);
      if (d.state === 'done')   done(d.step);
      if (d.state === 'error')  fail(d.step, d.msg);
    }

    // 语言切换时重新刷新所有文案（步骤标签会从 i18n 字典更新）
    if (window.electronAPI?.onLangChange) {
      window.electronAPI.onLangChange(() => applyI18n());
    }

    // Drain buffered events from before IPC listener was ready
    if (window.__progressQueue) {
      window.__progressQueue.forEach(applyProgress);
      window.__progressQueue = null;
    }
    if (window.electronAPI) {
      window.electronAPI.onProgress(applyProgress);
    }
    // 失败后点击重试：先清空所有失败/完成态，再通知主进程重跑 setup
    function resetSplash() {
      ['runtime', 'start', 'plugin'].forEach(id => {
        const el = els[id];
        if (!el) return;
        el.classList.remove('active', 'done', 'error');
        el.querySelectorAll('.step-spinner').forEach(s => s.remove());
        const icon = el.querySelector('.step-icon');
        if (icon) { icon.style.visibility = ''; icon.textContent = '○'; }
      });
      retryBtn.style.display = 'none';
      tagline.textContent = t('app.tagline');
      status.textContent = '';
      pbar.style.width = '0%';
    }

    retryBtn.onclick = () => {
      resetSplash();
      window.electronAPI?.retry();
    };
  </script>
</body>
</html>
