# dsh-api plugin loader patch (legacy manual-mount layout, used only by
# dsh-desktop's fallback installer when the profile has no npm-installed
# copy of dsh-api).
#
# `name` is resolved relative to the profile directory (baseUrl), so this
# assumes `index.mjs` has been copied to `<profile>/dsh-api/`.
#
# The preferred distribution path is 'dsh plugin --profile <name> add
# github:lilming123/dsh-api' — see cordis.patch.yml + package.json for
# the standard bundle layout the loader picks up automatically.
- insert:
    - id: dsh-api
      name: ./dsh-api/index.mjs
