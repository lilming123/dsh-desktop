# dsh-api plugin loader patch
#
# Copy this file (or generate an equivalent) alongside your dsh profile and
# feed it to dsh via `--patch`, so the runtime knows to load the plugin.
# `name` is resolved relative to the profile directory (baseUrl), so the
# path below assumes you have copied `index.mjs` to `<profile>/dsh-api/`.
#
# Example (default web profile at $DSH_HOME/profiles/web):
#
#   mkdir -p $DSH_HOME/profiles/web/dsh-api
#   cp index.mjs $DSH_HOME/profiles/web/dsh-api/index.mjs
#   cp patch.yml $DSH_HOME/profiles/web/dsh-api.patch.yml
#   dsh web --patch $DSH_HOME/profiles/web/dsh-api.patch.yml --port 3080
#
# The top-level `insert` (without `id`) appends a new entry to the root
# loader list.
- insert:
    - id: dsh-api
      name: ./dsh-api/index.mjs
